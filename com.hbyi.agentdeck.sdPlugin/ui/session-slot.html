<!doctype html>
<html>
	<head lang="ko">
		<title>Agent Session Settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<style>
			.hint {
				font-size: 11px;
				line-height: 1.5;
				opacity: 0.7;
				padding: 4px 8px 0 8px;
			}
		</style>
	</head>

	<body>
		<sdpi-item label="고정할 프로젝트">
			<sdpi-textfield setting="pin" placeholder="비워두면 자동 배정"></sdpi-textfield>
		</sdpi-item>
		<div class="hint">
			프로젝트 폴더 이름(키 위에 보이는 이름)을 적으면 이 키는 그 세션만 보여줍니다.<br />
			비워두면 고정되지 않은 세션이 열린 순서대로 왼쪽 위 키부터 채워집니다.
		</div>
	</body>
</html>
